version: 1
mode: "auto"
max_key_questions_per_round: 2
docs_root: "docs/project"
language: "zh-CN"
auto_update_project_memory: true
auto_git_commit: false
subagent_review: "never"
document_update_frequency: "event-driven"
archive_policy: "supersede-and-archive"
approval_required:
