const EDGE_KINDS = {
  latent: "说的是同一件底层的事",
  prereq: "没有前一条,后一条拿不到",
  caught: "后来这条把先前悬空的那条接住了",
};

/* ================= 心智地图 ================= */
function mentalMap(solved) {
  const obsIds = [...solved.evidence.observationIds];
  const has = new Set(obsIds);
  const inactive = new Set(solved.evidence.inactiveObservationIds);
  const negative = new Set(solved.evidence.unresolvedNegativeIds);
  const scoped = new Set(solved.evidence.scopeLimitedObservationIds);
  const caughtSet = new Set(solved.evidence.contextualizedObservationIds);

  const nodes = obsIds.map((id) => {
    const ev = EVENT_BY_OBS.get(id);
    const label = OBS_LABEL[id];
    const state =
      inactive.has(id) ? "suspended"
      : negative.has(id) ? "negative"
      : scoped.has(id) ? "scoped"
      : caughtSet.has(id) ? "caught"
      : "active";
    return {
      type: "obs", id, state,
      short: label?.short ?? id,
      gist: label?.gist ?? "",
      actionId: ev?.acquisitionActionId ?? null,
      latents: [...(ev?.sharedLatentIds ?? [])],
      region: ev?.coverage?.region ?? null,
      method: ev?.coverage?.method ?? null,
    };
  });

  /* --- 局部 Finding:同一潜变量上聚起 ≥2 条观察时自动成形 --- */
  const byLatent = new Map();
  for (const n of nodes) {
    if (n.state === "suspended") continue; /* 悬空的还没接上,不算进 Finding */
    for (const L of n.latents) {
      if (!byLatent.has(L)) byLatent.set(L, []);
      byLatent.get(L).push(n.id);
    }
  }
  const findings = [];
  for (const [L, members] of byLatent) {
    if (members.length < 2) continue;
    const sem = LATENT_SEMANTICS[L];
    findings.push({
      type: "finding", id: "F:" + L, latentId: L,
      short: sem?.name ?? L, gist: sem?.meaning ?? "",
      members: [...members].sort(),
    });
  }
  findings.sort((a, b) => a.id.localeCompare(b.id));

  /* --- 逻辑边 --- */
  const edges = [];
  const seen = new Set();
  const push = (from, to, kind, note) => {
    const key = kind + "|" + from + "|" + to;
    if (seen.has(key)) return;
    seen.add(key);
    edges.push({ from, to, kind, note });
  };

  /* 1. latent:观察 → 它所属的局部 Finding */
  for (const f of findings) {
    for (const m of f.members) push(m, f.id, "latent", f.short);
  }
  /* 潜变量上只有一条观察时不连边 —— 玩家还没有那个 Finding,图上就不该有它。 */

  /* 2. prereq:B 的获取前置由 A 的事实满足 */
  const factWitnesses = solved.coverage.factWitnesses ?? {};
  for (const id of obsIds) {
    const ev = EVENT_BY_OBS.get(id);
    for (const need of ev?.acquisitionRequires ?? []) {
      for (const w of factWitnesses[need] ?? []) {
        if (w.observationId !== id && has.has(w.observationId)) {
          push(w.observationId, id, "prereq", EDGE_KINDS.prereq);
        }
      }
    }
  }

  /* 3. caught:谁把悬空的那条接住了 */
  const caw = solved.coverage.contextActivationWitnesses ?? {};
  for (const [obsId, info] of Object.entries(caw)) {
    if (!has.has(obsId)) continue;
    for (const list of Object.values(info.witnesses ?? {})) {
      for (const w of list) {
        if (has.has(w.observationId)) {
          push(w.observationId, obsId, "caught", EDGE_KINDS.caught);
        }
      }
    }
  }

  /* --- 公理:已成立且无争议的主张,钉住不动,从决策面离场 --- */
  const axioms = [];
  for (const [claimId, c] of Object.entries(solved.claims ?? {})) {
    if (CLAIM_NOT_ON_MAP.has(claimId)) continue;
    if (!c?.established) continue;
    if (c.contested || c.logicallyRefuted) continue;
    axioms.push({
      type: "axiom", id: "AX:" + claimId, claimId,
      short: CLAIM_LABEL[claimId] ?? claimId,
      line: (CLAIM_LABEL[claimId] ?? claimId) + " —— 已定,不再需要论证",
      supports: claimSupporters(solved, claimId),
    });
  }
  axioms.sort((a, b) => a.id.localeCompare(b.id));

  /* 公理 → 支撑它的观察,画作 supports 边(仍属免费自动生成) */
  for (const ax of axioms) {
    for (const m of ax.supports) if (has.has(m)) push(m, ax.id, "supports", ax.short);
  }

  return { nodes, findings, axioms, edges, components: components(nodes, findings, axioms, edges) };
}

/* 哪些观察在支撑某个主张:proofWitnesses 给槽位 → 事实,factWitnesses 给事实 → 观察。
   全部来自求解器输出,不复制求解器的判定逻辑。 */
function claimSupporters(solved, claimId) {
  const pw = solved.coverage.proofWitnesses?.[claimId];
  const fw = solved.coverage.factWitnesses ?? {};
  if (!pw || Array.isArray(pw)) return [];
  const out = new Set();
  for (const facts of Object.values(pw)) {
    for (const f of facts ?? []) for (const w of fw[f] ?? []) out.add(w.observationId);
  }
  return [...out].sort();
}

/* 连通分量。用来找 DEC-032 决策面第四类「孤立小簇」。 */
function components(nodes, findings, axioms, edges) {
  const ids = [...nodes.map((n) => n.id), ...findings.map((f) => f.id), ...axioms.map((a) => a.id)];
  const adj = new Map(ids.map((i) => [i, []]));
  for (const e of edges) {
    if (adj.has(e.from) && adj.has(e.to)) { adj.get(e.from).push(e.to); adj.get(e.to).push(e.from); }
  }
  const seen = new Set(); const comps = [];
  for (const i of ids) {
    if (seen.has(i)) continue;
    const stack = [i]; const comp = [];
    seen.add(i);
    while (stack.length) {
      const x = stack.pop(); comp.push(x);
      for (const y of adj.get(x) ?? []) if (!seen.has(y)) { seen.add(y); stack.push(y); }
    }
    comps.push(comp.sort());
  }
  comps.sort((a, b) => b.length - a.length || a[0].localeCompare(b[0]));
  return comps;
}

/* ================= 决策面 ================= */
/* DEC-032 第八节:只装四类。第七节:多个缺口并列、每个若干手段、都标价、不排序。 */
function decisionSurface(solved, workbenchRows) {
  const usableById = new Map((workbenchRows ?? []).map((r) => [r.action.id, r]));
  const map = mentalMap(solved);
  const nodeById = new Map(map.nodes.map((n) => [n.id, n]));

  /* 手段:把 fact 或 role 翻译成「行里靠什么手段补它」,带价,不排序。 */
  const meansForFacts = (facts) => {
    const acts = new Set();
    for (const f of facts) for (const a of FACT_PRODUCERS.get(f) ?? []) acts.add(a);
    return [...acts].map(meansOf).filter(Boolean);
  };
  const meansOf = (actionId) => {
    const a = ACTION_BY_ID.get(actionId);
    if (!a) return null;
    const row = usableById.get(actionId);
    const sem = ACTION_SEMANTICS[actionId];
    return {
      actionId, name: a.name, ask: a.ask,
      cost: a.cost, costLabel: COST_LABEL[a.cost],
      usable: row ? row.usable : null,
      why: row?.why ?? null,
      done: row?.done ?? false,
      whyShort: sem?.whyShort ?? "",
    };
  };

  const items = [];

  /* 第一类:意义未定观察 —— 拿到了,还接不上任何东西 */
  const caw = solved.coverage.contextActivationWitnesses ?? {};
  const haveIds = new Set(map.nodes.map((n) => n.id));
  const negativeIds = new Set(solved.evidence.unresolvedNegativeIds);
  /* 换一种更够格的手段去问同一件底层的事 —— 从该观察所在的潜变量上找还没拿到的兄弟。
     只用玩家已经碰过的潜变量,不去枚举他没碰过的。 */
  const siblingMeans = (id) => {
    const latents = nodeById.get(id)?.latents ?? [];
    return meansForFacts(latents.flatMap((L) => latentSiblingFacts(L, haveIds)));
  };
  for (const id of solved.evidence.inactiveObservationIds) {
    if (negativeIds.has(id)) continue; /* 阴性另有说法,不重复列 */
    /* caw 只在前提已有见证时才出现;没出现时退回夹具的静态声明。 */
    const need = caw[id]?.requiredFacts ?? EVENT_BY_OBS.get(id)?.requiresContextFacts ?? [];
    items.push({
      kind: "suspended", id: "S:" + id,
      title: (nodeById.get(id)?.short ?? id) + " 暂时接不上",
      body: "这条已经拿到了,但缺一个前提才能安全解释它。补上之后它会自动接进来,而且不重复计权。",
      means: meansForFacts(need),
    });
  }
  for (const id of negativeIds) {
    items.push({
      kind: "negative", id: "N:" + id,
      title: (nodeById.get(id)?.short ?? id) + " 没筛出东西,但不够格下结论",
      body: "这次没有发现信号。问题是这次筛查的能力不足以支撑「没有」这个结论 —— 阴性要成为证据,得先证明手段够格。换一种更能定层的手段去问同一件事。",
      means: siblingMeans(id),
    });
  }
  for (const id of solved.evidence.scopeLimitedObservationIds) {
    items.push({
      kind: "suspended", id: "L:" + id,
      title: (nodeById.get(id)?.short ?? id) + " 落在范围之外",
      body: "这条本身站得住,但它覆盖的范围不是当前问题需要的那一块。",
      means: [],
    });
  }

  /* 第二类:差一件即可合拢 —— 夹逼的靶子 */
  /* 2a. 主张的槽位。恰好只剩一个空 = onemore(夹逼靶子);
         剩两个以上但已有进展 = gap。

         gap 这一档是执行中放宽出来的,DEC-032 第八节原文只写了「差一件就能合拢」。
         不放宽会出现空白决策面:主张一旦缺两块以上就什么都不显示,玩家在 G1/G2
         面对一片空白 —— 那正是 DEC-032 要治的病。已在 README 声明,待用户裁决。 */
  for (const [claimId, pw] of Object.entries(solved.coverage.proofWitnesses ?? {})) {
    if (CLAIM_NOT_ON_MAP.has(claimId) || Array.isArray(pw)) continue;
    if (solved.claims?.[claimId]?.established) continue;
    const slots = Object.entries(pw);
    const empty = slots.filter(([, v]) => !(v ?? []).length);
    const filled = slots.length - empty.length;
    if (!filled || !empty.length) continue;
    if (empty.length === 1) {
      const [slot] = empty[0];
      items.push({
        kind: "onemore", id: "C:" + claimId + ":" + slot,
        title: `「${CLAIM_LABEL[claimId] ?? claimId}」只差一块:${SLOT_LABEL[claimId]?.[slot] ?? slot}`,
        body: `这项主张要的其他部分你已经有了,缺的是${SLOT_LABEL[claimId]?.[slot] ?? slot}。补上它,这一整块就合拢。`,
        means: meansForSlot(claimId, slot, meansForFacts),
      });
    } else {
      items.push({
        kind: "gap", id: "C:" + claimId,
        title: `「${CLAIM_LABEL[claimId] ?? claimId}」已经动起来了,还缺 ${empty.length} 块`,
        body: `已经落定的是:${slots.filter(([, v]) => (v ?? []).length)
          .map(([k]) => SLOT_LABEL[claimId]?.[k] ?? k).join("、")}。` +
          `还没有的是:${empty.map(([k]) => SLOT_LABEL[claimId]?.[k] ?? k).join("、")}。`,
        means: dedupeMeans(empty.flatMap(([slot]) => meansForSlot(claimId, slot, meansForFacts))),
        slots: empty.map(([slot]) => ({
          slot, label: SLOT_LABEL[claimId]?.[slot] ?? slot,
          means: meansForSlot(claimId, slot, meansForFacts),
        })),
      });
    }
  }
  /* 2b. 证明角色的独立来源不够。注意:minimumSourceCount 数的是来源并集,不是 witness 个数。 */
  for (const [roleId, contract] of Object.entries(proofRoleContracts)) {
    const ws = solved.coverage.proofRoleWitnesses?.[roleId];
    if (!ws?.length) continue;
    const sources = new Set();
    for (const w of ws) for (const s of w.sourceIds ?? []) sources.add(s);
    if (sources.size >= (contract.minimumSourceCount ?? 1)) continue;
    const sem = PROOF_ROLE_SEMANTICS[roleId];
    items.push({
      kind: "onemore", id: "R:" + roleId,
      title: (sem?.name ?? roleId) + " 还差一个独立来源",
      body: (sem?.meaning ? sem.meaning + " " : "") +
        `这一块要 ${contract.minimumSourceCount} 个彼此独立的来源,现在只有 ${sources.size} 个 —— 换一种手段印证同一件事是有用的,重复同一种手段没有用。`,
      means: [meansOf(contract.acquisitionActionId)].filter(Boolean),
    });
  }
  /* 2c. 档案三关系里差一环 */
  for (const [group, rel] of Object.entries(solved.coverage.archiveRelations ?? {})) {
    const states = ["recordCoherence", "objectAttribution", "eventCorroboration"]
      .map((k) => [k, rel[k]]);
    const open = states.filter(([, v]) => v === "unresolved" || v === "suggestive");
    const done = states.filter(([, v]) => v === "established");
    if (!done.length || open.length !== 1) continue;
    const [k, v] = open[0];
    items.push({
      kind: "onemore", id: "A:" + group + ":" + k,
      title: `${ARCHIVE_GROUP_LABEL[group] ?? group}:${ARCHIVE_REL_LABEL[k]} —— ${ARCHIVE_REL_STATE[v]}`,
      body: "档案要分三件事看:记录之间自洽吗、记录说的是这只碗吗、记录说的事在物证上对得上吗。你已经落定了其中的一部分,这一环还没有。",
      means: meansForArchive(group, k, meansOf),
    });
  }

  /* 第三类:打架的 */
  for (const c of solved.conflicts ?? []) {
    items.push({
      kind: "conflict", id: "X:" + (c.code ?? c.id ?? JSON.stringify(c).slice(0, 24)),
      title: "有两处对不上",
      body: "手上的东西互相矛盾。矛盾本身也是情报 —— 至少有一处读错了,或者其中一条根本不属于这只碗。",
      means: [], raw: c,
    });
  }
  for (const [claimId, c] of Object.entries(solved.claims ?? {})) {
    if (CLAIM_NOT_ON_MAP.has(claimId)) continue;
    if (!c?.contested && !c?.logicallyRefuted) continue;
    items.push({
      kind: "conflict", id: "XC:" + claimId,
      title: `「${CLAIM_LABEL[claimId] ?? claimId}」${c.logicallyRefuted ? "已被推翻" : "有争议"}`,
      body: c.logicallyRefuted
        ? "有一条证据在逻辑上直接否掉了这项主张。"
        : "支持与反对同时存在,这项主张现在站不稳。",
      means: [],
    });
  }
  for (const [group, rel] of Object.entries(solved.coverage.archiveRelations ?? {})) {
    for (const k of ["recordCoherence", "objectAttribution", "eventCorroboration"]) {
      if (rel[k] !== "contested") continue;
      items.push({
        kind: "conflict", id: "XA:" + group + ":" + k,
        title: `${ARCHIVE_GROUP_LABEL[group] ?? group}:${ARCHIVE_REL_LABEL[k]} 有冲突`,
        body: "这一环上出现了互相打架的说法。",
        means: meansForArchive(group, k, meansOf),
      });
    }
  }

  /* 第四类:孤立小簇 —— 内部自洽但没连上主结构 */
  const [main, ...rest] = map.components;
  for (const comp of rest) {
    const obsMembers = comp.filter((x) => nodeById.has(x));
    if (!obsMembers.length) continue;
    const suspended = new Set([...solved.evidence.inactiveObservationIds]);
    if (obsMembers.every((x) => suspended.has(x))) continue; /* 已在第一类里说过 */
    items.push({
      kind: "island", id: "I:" + comp[0],
      title: obsMembers.map((x) => nodeById.get(x).short).join("、") + " 还是一座孤岛",
      body: comp.length === 1
        ? "这条自己站得住,但还没有和别的东西发生关系。也可能它本来就相对独立 —— 离散不是缺陷。"
        : "这一小簇内部说得通,但和主结构还没接上。",
      means: meansForFacts(
        obsMembers.flatMap((x) => (nodeById.get(x)?.latents ?? []))
          .flatMap((L) => latentSiblingFacts(L, new Set(map.nodes.map((n) => n.id)))),
      ),
    });
  }

  /* 公理:已定案的一行,离场但仍在全图 */
  const axiomLines = map.axioms.map((a) => a.line);

  /* 决策面清空是一个有意义的状态,不是空白界面。
     这里刻意不把「玩家还没动过的主张」列出来充数 —— 那就是 DEC-032 第八节要治的
     todolist。没有悬而未决的东西时,开不开新线是纯粹的意图,按第七节那是玩家的活。 */
  const clear = items.length === 0;
  const clearLine = clear
    ? (map.nodes.length === 0
        ? "还没有任何情报。左边那只碗随便看,免费的几眼不要钱。"
        : "没有悬而未决的东西了:没有接不上的情报,没有差一件就合拢的,也没有打架的。" +
          "收手是一个正当选择;想往下走,就得自己开一条新线 —— 开哪条由你定。")
    : null;

  return { items, clear, clearLine, axioms: map.axioms, axiomLines, map,
           mainComponentSize: main?.length ?? 0 };
}

/* 某槽位要哪些事实 → 哪些手段产出这些事实。
   SLOT_FACTS 抄自满局求解器输出(见 harness 的防漂移检查),不是猜的。 */
function meansForSlot(claimId, slot, meansForFacts) {
  return dedupeMeans(meansForFacts(SLOT_FACTS[claimId]?.[slot] ?? []));
}
function meansForArchive(group, relKind, meansOf) {
  const roleId = ARCHIVE_ROLE[group]?.[relKind];
  const ids = Array.isArray(roleId) ? roleId : [roleId];
  const out = [];
  for (const r of ids) {
    const c = proofRoleContracts[r];
    if (c) { const m = meansOf(c.acquisitionActionId); if (m) out.push(m); }
  }
  return dedupeMeans(out);
}
function dedupeMeans(list) {
  const seen = new Set();
  return list.filter((m) => (seen.has(m.actionId) ? false : (seen.add(m.actionId), true)));
}
/* 同一潜变量上还没拿到的那些观察需要什么事实 —— 用来给孤岛提手段。
   只用玩家已有节点所在的潜变量,不去枚举玩家没碰过的潜变量。 */
function latentSiblingFacts(latentId, haveIds) {
  const out = [];
  for (const ev of Object.values(events)) {
    if (!(ev.sharedLatentIds ?? []).includes(latentId)) continue;
    if (haveIds.has(ev.observationId)) continue;
    if (!ACTION_BY_ID.has(ev.acquisitionActionId)) continue;
    out.push(...(ev.facts ?? []));
  }
  return out;
}

/* 槽位 → 它要的事实。抄自满局(22 动作)求解器输出的 coverage.proofWitnesses。
   harness 会拿满局输出回比这张表,漂移就报错。 */
const SLOT_FACTS = {

    eventCorroboration: ["PROOF.ARCHIVE.T2.EVENT_CURRENT_CORROBORATION",

/* ================= G:不进地图,只作一行读数 ================= */
function readout(solved, session) {
  const sem = STAGE_SEMANTICS[solved.stage];
  const paths = solved.coverage.majorProofPaths ?? {};
  return {
    stage: solved.stage,
    name: sem?.name ?? solved.stage,
    line: sem?.meaning ?? "",
    used: session?.log?.length ?? 0,
    routes: [
      { id: "documented", ...ROUTE_SEMANTICS.documented, open: !!paths.documented },
      { id: "physical", ...ROUTE_SEMANTICS.physical, open: !!paths.physical },
    ],
    frozenStage: solved.stopping?.frozenStage ?? null,
  };
}

return { OBS_LABEL, CLAIM_LABEL, CLAIM_NOT_ON_MAP, SLOT_LABEL, ARCHIVE_REL_LABEL, ARCHIVE_REL_STATE, ARCHIVE_GROUP_LABEL, EDGE_KINDS, mentalMap, claimSupporters, decisionSurface, SLOT_FACTS, readout };
})();

/* ==================== 力导向布局 ==================== */
/* 公理钉住不动(DEC-032 第十二节);需要自由重排的只剩活跃区。 */
function mapBox() {
  const w = $("#mapwrap").clientWidth, h = $("#mapwrap").clientHeight;
  return { w, h };
}
function layout(graph, { iters = 260 } = {}) {
  const { w, h } = mapBox();
  const nodes = [...graph.nodes, ...graph.findings, ...graph.axioms];
  const ids = new Set(nodes.map((n) => n.id));
  for (const id of [...positions.keys()]) if (!ids.has(id)) positions.delete(id);

  /* 新节点先落在中心附近(带确定性抖动,便于复现) */
  let seed = nodes.length * 7919;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  for (const n of nodes) {
    if (!positions.has(n.id)) {
      positions.set(n.id, { x: w / 2 + (rnd() - .5) * 140, y: h / 2 + (rnd() - .5) * 140 });
    }
  }
  const adj = graph.edges.filter((e) => positions.has(e.from) && positions.has(e.to));
  /* 目标边长按画布面积与节点数取,否则节点少时整团缩在中心、画布大半空着 */
  const K = Math.max(96, Math.min(190, Math.sqrt((w - 150) * (h - 110) / Math.max(3, nodes.length)) * 0.82));
  const R = K * K * 2.6;             /* 斥力随边长同步放大 */
  for (let it = 0; it < iters; it++) {
    const t = 1 - it / iters;
    const fx = new Map(nodes.map((n) => [n.id, 0]));
    const fy = new Map(nodes.map((n) => [n.id, 0]));
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = positions.get(nodes[i].id), b = positions.get(nodes[j].id);
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = (rnd() - .5); dy = (rnd() - .5); d2 = 1; }
        const f = R / d2;
        const d = Math.sqrt(d2);
        fx.set(nodes[i].id, fx.get(nodes[i].id) + (dx / d) * f);
        fy.set(nodes[i].id, fy.get(nodes[i].id) + (dy / d) * f);
        fx.set(nodes[j].id, fx.get(nodes[j].id) - (dx / d) * f);
        fy.set(nodes[j].id, fy.get(nodes[j].id) - (dy / d) * f);
      }
    }
    for (const e of adj) {
      const a = positions.get(e.from), b = positions.get(e.to);
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      const f = (d - K) * 0.055;
      fx.set(e.from, fx.get(e.from) + (dx / d) * f);
      fy.set(e.from, fy.get(e.from) + (dy / d) * f);
      fx.set(e.to, fx.get(e.to) - (dx / d) * f);
      fy.set(e.to, fy.get(e.to) - (dy / d) * f);
    }
    for (const n of nodes) {
      const p = positions.get(n.id);
      /* 公理钉住:一旦定案,位置不再参与重排 */
      if (pinned.has(n.id)) continue;
      p.x += Math.max(-20, Math.min(20, fx.get(n.id))) * t;
      p.y += Math.max(-20, Math.min(20, fy.get(n.id))) * t;
      /* 极轻的向心,只防飘走,不把图拉成一团 */
      p.x += (w / 2 - p.x) * 0.0022;
      p.y += (h / 2 - p.y) * 0.0022;
      p.x = Math.max(84, Math.min(w - 84, p.x));
      p.y = Math.max(44, Math.min(h - 52, p.y));
    }
  }
  /* 新定案的公理落位后钉住 */
  for (const a of graph.axioms) pinned.add(a.id);
}

  svg.appendChild(el("path", { class: "bowl",
    d: "M74 74 C74 176 106 214 153 214 C200 214 232 176 232 74" }));
  svg.appendChild(el("path", { class: "bowl", d: "M74 74 L232 74" }));
  svg.appendChild(el("path", { class: "bowl", d: "M129 214 L129 222 L177 222 L177 214",
    "stroke-dasharray": "0" }));

  for (const [pid, p] of Object.entries(ON_OBJECT)) {
    const acts = BY_PLACE.get(pid) ?? [];
    if (!acts.length) continue;
    const allDone = acts.every((a) => wbRows.find((r) => r.action.id === a.id)?.done);
    const g = el("g", { class: "hot" + (allDone ? " spent" : ""), "data-place": pid });
    g.appendChild(el("circle", { class: "hit", cx: p.x, cy: p.y, r: 20 }));
    g.appendChild(el("circle", { class: "dot", cx: p.x, cy: p.y, r: 5 }));
    const tx = p.anchor === "end" ? p.x - 11 : p.anchor === "start" ? p.x + 11 : p.x;
    const ty = p.anchor === "middle" ? p.y + 19 : p.y + 4;
    const t = el("text", { x: tx, y: ty, "text-anchor": p.anchor });
    t.appendChild(txt(p.label));
    g.appendChild(t);
    g.addEventListener("click", (ev) => openPop(pid, ev.currentTarget));
    svg.appendChild(g);
  }
}

/* ---------- 左下:器物之外 ---------- */
function renderOutside() {
  const box = $("#outside");
  box.textContent = "";
  for (const grp of OUTSIDE) {
    const h = document.createElement("div");
    h.className = "grp"; h.textContent = grp.grp;
    box.appendChild(h);
    for (const p of grp.places) {
      const acts = BY_PLACE.get(p.id) ?? [];
      if (!acts.length) continue;
      const rows = acts.map((a) => wbRows.find((r) => r.action.id === a.id));
      const done = rows.every((r) => r?.done);
      const blocked = rows.every((r) => !r?.usable);
      const cheapest = Math.min(...acts.map((a) => a.cost));
      const d = document.createElement("div");
      d.className = "mrow" + (done ? " spent" : "") + (blocked && !done ? " blocked" : "");
      d.dataset.place = p.id;
      d.innerHTML = `<span class="nm">${esc(p.label)}</span>` +
        `<span class="cs">${acts.length > 1 ? acts.length + " 项 · " : ""}${esc(COST_LABEL[cheapest])}</span>`;
      d.addEventListener("click", () => openPop(p.id, d));
      box.appendChild(d);
    }
  }
}

/* ---------- 动作浮层 ---------- */
let openPlace = null;
function closePop() {
  $("#pop").style.display = "none";
  openPlace = null;
  document.querySelectorAll(".hot.open,.mrow.open").forEach((n) => n.classList.remove("open"));
}
function openPop(pid, anchorEl) {
  if (openPlace === pid) return closePop();
  closePop();
  openPlace = pid;
  anchorEl.classList.add("open");
  const acts = BY_PLACE.get(pid) ?? [];
  const pop = $("#pop");
  pop.textContent = "";
  acts.forEach((a, i) => {
    const row = wbRows.find((r) => r.action.id === a.id);
    const sem = ACTION_SEMANTICS[a.id] ?? {};
    const wrap = document.createElement("div");
    wrap.innerHTML =
      `<h4>${esc(a.name)}</h4>` +
      `<div class="ask">${esc(a.ask)}</div>` +
      `<div class="why">${esc(sem.whyShort ?? "")}</div>` +
      `<div class="long" data-long>${esc(sem.whyLong ?? "")}</div>` +
      (row?.usable ? "" : `<div class="no">${esc(row?.why ?? (S.stopped ? "本局已经收手" : "现在不能做"))}</div>`) +
      `<div class="foot"><span class="cost">费用 ${esc(COST_LABEL[a.cost])}` +
        `${row?.done ? " · 已经做过" : ""}</span>` +
        `<span class="acts"><button class="lk" data-more>为什么要紧</button>` +
        `<button class="go" ${row?.usable && row?.affordable ? "" : "disabled"} data-run>做这一步</button>` +
        `</span></div>`;
    wrap.querySelector("[data-more]").addEventListener("click", () => {
      const L = wrap.querySelector("[data-long]");
      L.style.display = L.style.display === "block" ? "none" : "block";
    });
    const go = wrap.querySelector("[data-run]");
    if (!go.disabled) go.addEventListener("click", () => doAction(a.id, pid));
    pop.appendChild(wrap);
    if (i < acts.length - 1) {
      const s = document.createElement("div"); s.className = "sep"; pop.appendChild(s);
    }
  });
  /* 定位:贴着左栏右边缘 */
  const r = anchorEl.getBoundingClientRect();
  pop.style.display = "block";
  const top = Math.min(Math.max(8, r.top - 10), window.innerHeight - pop.offsetHeight - 12);
  pop.style.left = "312px";
  pop.style.top = top + "px";
}
document.addEventListener("click", (e) => {
  if (openPlace && !$("#pop").contains(e.target) &&
      !e.target.closest(".hot") && !e.target.closest(".mrow") && !e.target.closest(".mean")) closePop();
});

/* ---------- 中:心智地图 ---------- */
function nodeShape(n) {
  if (n.type === "obs") {
    const cls = "n-obs" + (n.state === "suspended" ? " susp"
      : n.state === "negative" ? " neg" : n.state === "caught" ? " caught" : "");
    return el("circle", { class: cls, r: 7, cx: 0, cy: 0 });
  }
  if (n.type === "finding") {
    return el("polygon", { class: "n-find", points: "0,-10 9,-5 9,5 0,10 -9,5 -9,-5" });
  }
  return el("rect", { class: "n-ax", x: -9, y: -7, width: 18, height: 14, rx: 2 });
}
function renderMap(target) {
  const svg = target ? $("#hsvg") : $("#map");
  const g = target ? target : view.map;
  const pos = target ? target.pos : positions;
  const { w, h } = target ? { w: $("#hsvgwrap").clientWidth, h: $("#hsvgwrap").clientHeight } : mapBox();
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.textContent = "";
  const graph = target ? target.map : g;

  const empty = graph.nodes.length === 0;
  if (!target) {
    $("#mapempty").style.display = empty ? "flex" : "none";
    $("#mapempty").textContent = empty
      ? "右边现在是空的。这不是隐藏 —— 你还没有任何情报,所以这里没有任何位置。左边那只碗随便看,免费的几眼不要钱。"
      : "";
    $("#lgd").innerHTML = empty ? "" : legendHTML();
  }
  if (empty) return;

  const layer = el("g");
  for (const e of graph.edges) {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const cx = mx - dy * 0.09, cy = my + dx * 0.09;
    layer.appendChild(el("path", {
      class: "edge e-" + e.kind, d: `M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,
      "data-edge": e.kind + "|" + e.from + "|" + e.to,
    }));
  }
  svg.appendChild(layer);

  const all = [...graph.nodes, ...graph.findings, ...graph.axioms];
  for (const n of all) {
    const p = pos.get(n.id);
    if (!p) continue;
    const gg = el("g", { class: "nd" + (n.type !== "obs" ? " on" : ""), transform: `translate(${p.x},${p.y})`,
      "data-node": n.id });
    gg.appendChild(nodeShape(n));
    /* 标签按 id 的稳定哈希分到上下两侧。用哈希而不是用坐标,是为了动画过程中不跳动。 */
    const r0 = n.type === "finding" ? 15 : 12;
    const below = hash(n.id) % 2 === 1;
    const t = el("text", { x: 0, y: below ? r0 + 9 : -r0, "text-anchor": "middle" });
    t.appendChild(txt(n.short));
    gg.appendChild(t);
    if (!target) {
      gg.addEventListener("mouseenter", (ev) => showTip(n, ev));
      gg.addEventListener("mouseleave", () => { $("#tip").style.display = "none"; });
    }
    svg.appendChild(gg);
  }
}
function legendHTML() {
  const sw = (c, d) => `<span class="sw" style="border-top-color:${c};border-top-style:${d}"></span>`;
  return [
    `<i>${sw("#5d5a52", "solid")}${esc(EDGE_KINDS.latent)}</i>`,
    `<i>${sw("#4a5560", "dashed")}${esc(EDGE_KINDS.prereq)}</i>`,
    `<i>${sw("#a97fc2", "solid")}${esc(EDGE_KINDS.caught)}</i>`,
    `<i>${sw("#3d4a38", "solid")}支持一条已定的公理</i>`,
    `<i><span style="color:var(--obs)">●</span> 情报</i>`,
    `<i><span style="color:var(--find)">⬣</span> 局部 Finding(系统免费连出来的)</i>`,
    `<i><span style="color:var(--axiom)">▬</span> 公理</i>`,
  ].join("");
}
function showTip(n, ev) {
  const t = $("#tip");
  const extra = n.type === "finding"
    ? `<div style="color:var(--find);margin-top:4px">这一条是系统自动连出来的,没花你的钱</div>` : "";
  t.innerHTML = `<b>${esc(n.short)}</b>${esc(n.gist ?? "")}${extra}`;
  const box = $("#mapwrap").getBoundingClientRect();
  t.style.display = "block";
  t.style.left = Math.min(ev.clientX - box.left + 14, box.width - 262) + "px";
  t.style.top = Math.min(ev.clientY - box.top + 12, box.height - 90) + "px";
}

/* ---------- 右:决策面 ---------- */
const KIND_LABEL = {
  suspended: "意义未定的情报", negative: "不够格的阴性结果",
  onemore: "差一件就合拢", gap: "已经动起来,还缺几块",
  conflict: "打架的", island: "还没连上主结构",
};
function renderDeck() {
  const box = $("#deckbody");
  box.textContent = "";
  for (const a of view.map.axioms) {
    const d = document.createElement("div");
    d.className = "ax"; d.textContent = a.line;
    box.appendChild(d);
  }
  if (view.ds.clear) {
    const d = document.createElement("div");
    d.className = "clear"; d.textContent = view.ds.clearLine;
    box.appendChild(d);
    return;
  }
  for (const it of view.ds.items) {
    const c = document.createElement("div");
    c.className = "card k-" + it.kind;
    let html = `<div class="kd">${esc(KIND_LABEL[it.kind] ?? it.kind)}</div>` +
      `<h5>${esc(it.title)}</h5><p>${esc(it.body)}</p>`;
    if (it.means.length) {
      html += `<div class="means"><div class="hd">行里通常靠这些手段(不分先后)</div>` +
        it.means.map((m) => `<div class="mean${m.usable === false ? " blocked" : ""}" data-act="${esc(m.actionId)}">` +
          `<span class="nm">${esc(m.name)}</span><span class="cs">${esc(m.costLabel)}` +
          `${m.usable === false ? " · 暂不可用" : ""}${m.done ? " · 做过" : ""}</span></div>`).join("") +
        `</div>`;
    }
    c.innerHTML = html;
    c.querySelectorAll("[data-act]").forEach((n) => {
      n.addEventListener("click", () => {
        const a = ACTION_BY_ID.get(n.dataset.act);
        if (a) openPop(a.place, n);
      });
    });
    box.appendChild(c);
  }
}

/* ==================== 两拍动画 ==================== */
/* 第一拍:归因 —— 从左侧那个刚做的行动飞一条线到右侧新入场的情报,周围先不动。
   停顿。
   第二拍:后果 —— 整图重组,被串起来的先亮一下再归位。 */
function doAction(actionId, pid) {
  closePop();
  if (anim) return;
  const before = view.map;
  const beforePos = new Map([...positions].map(([k, v]) => [k, { x: v.x, y: v.y }]));
  const r = take(S, actionId);
  if (!r.ok) { alert(r.why); return; }
  recompute();

  const newId = r.observationId;
  const beforeIds = new Set([...before.nodes, ...before.findings, ...before.axioms].map((n) => n.id));
  const fresh = [...view.map.nodes, ...view.map.findings, ...view.map.axioms]
    .filter((n) => !beforeIds.has(n.id)).map((n) => n.id);

  renderHeader(); renderObject(); renderOutside();

  /* 先按旧位置画一遍,让新节点从左侧飞入 */
  const { w, h } = mapBox();
  positions = beforePos;
  const anchorScreen = placeScreenPoint(pid);
  positions.set(newId, { x: Math.max(90, anchorScreen.x), y: Math.min(Math.max(50, anchorScreen.y), h - 60) });
  /* 其他新生的(局部 Finding、公理)先藏在新情报附近 */
  for (const id of fresh) if (id !== newId) {
    const p = positions.get(newId);
    positions.set(id, { x: p.x + 18, y: p.y + 18 });
  }
  renderMap();
  flyLine(anchorScreen, positions.get(newId));
  markFlash([newId]);

  anim = true;
  setTimeout(() => {                       /* 停顿 */
    const from = new Map([...positions].map(([k, v]) => [k, { x: v.x, y: v.y }]));
    layout(view.map);
    const to = new Map([...positions].map(([k, v]) => [k, { x: v.x, y: v.y }]));
    tween(from, to, 620, () => {
      anim = null;
      renderDeck();
      snapshot(ACTION_BY_ID.get(actionId)?.name ?? actionId);
      /* 被这条串起来的那些先亮一下 */
      const touched = view.map.edges.filter((e) => e.from === newId || e.to === newId)
        .flatMap((e) => [e.from, e.to]);
      markFlash([...new Set([newId, ...touched, ...fresh])], 700);
    });
  }, 520);
}
function placeScreenPoint(pid) {
  const box = $("#mapwrap").getBoundingClientRect();
  let r;
  const hot = document.querySelector(`[data-place="${pid}"]`);
  if (hot) r = hot.getBoundingClientRect();
  if (!r) return { x: 90, y: 90 };
  return { x: -40, y: r.top + r.height / 2 - box.top, sx: r.left + r.width / 2 - box.left,
           sy: r.top + r.height / 2 - box.top };
}
function flyLine(from, to) {
  const svg = $("#map");
  const p = el("path", { class: "fly",
    d: `M${from.sx ?? 0},${from.sy ?? to.y} Q${(from.sx + to.x) / 2},${to.y - 40} ${to.x},${to.y}` });
  svg.appendChild(p);
  const len = 400;
  p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
  p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 460, fill: "forwards" });
  setTimeout(() => p.remove(), 1100);
}
function markFlash(ids, ms = 520) {
  for (const id of ids) {
    const n = document.querySelector(`[data-node="${cssEsc(id)}"]`);
    if (!n) continue;
    n.classList.add("flash");
    setTimeout(() => n.classList.remove("flash"), ms);
  }
}
const cssEsc = (s) => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/[.:|]/g, "\\$&");
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0x7fffffff; return h; }
function tween(from, to, ms, done) {
  const t0 = performance.now();
  const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  function frame(now) {
    const k = Math.min(1, (now - t0) / ms), e = ease(k);
    for (const [id, b] of to) {
      const a = from.get(id) ?? b;
      positions.set(id, { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e });
    }
    renderMap();
    if (k < 1) requestAnimationFrame(frame); else done && done();
  }
  requestAnimationFrame(frame);
}

/* ==================== 历史回放:独立浮层,不占主界面 ==================== */
$("#bhist").addEventListener("click", () => {
  const h = $("#hist");
  h.style.display = "flex";
  const r = $("#hr");
  r.max = String(history.length - 1);
  r.value = String(history.length - 1);
  drawHistory(history.length - 1);
});
$("#hclose").addEventListener("click", () => { $("#hist").style.display = "none"; });
$("#hr").addEventListener("input", (e) => drawHistory(+e.target.value));
function drawHistory(i) {
  const h = history[i];
  if (!h) return;
  renderMap(h);
  $("#hcap").textContent = h.step === 0
    ? "开局:右侧还什么都没有"
    : `第 ${h.step} 步 · ${h.actLabel} —— ${h.ro.name}`;
  const box = $("#hdeck");
  box.textContent = "";
  for (const a of h.map.axioms) {
    const d = document.createElement("div"); d.className = "ax"; d.textContent = a.line;
    box.appendChild(d);
  }
  if (h.ds.clear) {
    const d = document.createElement("div"); d.className = "clear"; d.textContent = h.ds.clearLine;
    box.appendChild(d);
  }
  for (const it of h.ds.items) {
    const c = document.createElement("div");
    c.className = "card k-" + it.kind;
    c.innerHTML = `<div class="kd">${esc(KIND_LABEL[it.kind] ?? it.kind)}</div>` +
      `<h5>${esc(it.title)}</h5><p>${esc(it.body)}</p>`;
    box.appendChild(c);
  }
}

/* ==================== 其他 ==================== */
$("#bstop").addEventListener("click", () => {
  if (S.stopped) return;
  S.stopped = true;
  recompute(); renderAll(); snapshot("收手");
});
$("#breset").addEventListener("click", reset);
window.addEventListener("resize", () => { if (!anim) { layout(view.map, { iters: 90 }); renderMap(); } });

reset();
</script>
